name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HVACrate2.slnx

      - name: Build
        run: dotnet build HVACrate2.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet exec tests/HVACrate2.Core.Tests/bin/Release/net10.0/HVACrate2.Core.Tests.dll
          --report-trx
          --report-trx-filename test-results.trx
          --results-directory ./TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/test-results.trx
          retention-days: 14

  publish-check:
    runs-on: windows-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file (dry run)
        run: >
          dotnet publish src/HVACrate2.App
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output ./publish-check
